aid: raid-ai
name: Raid AI
description: >-
  Raid AI (RAID AI, Inc.) is an enterprise-grade deepfake and AI-content
  forensics platform covering audio, image, document, and video. Its REST API
  detects AI-generated, cloned, deepfaked, and digitally edited media —
  returning a verdict, a confidence score, and (on detailed plans) generator
  attribution — across image forensics, voice analysis, document tampering
  detection, and asynchronous fact-checking against the public record. Audio
  detection claims 98% accuracy and sub-50ms latency across 100+ languages with
  specialized Arabic dialect coverage. Raid AI runs a zero-retention pipeline
  (media analyzed in memory and discarded), offers cloud API plus on-premise
  air-gapped deployment, and ships native integrations with Microsoft Teams,
  Zoom, Google Meet, Slack, Webex, and WhatsApp for financial services, call
  centers, enterprise meetings, and government use cases.
